name: Update PMO Bot data

# Every hour from 08:00 to 19:00 Riyadh time (UTC+3 = 05:00-16:00 UTC), Sunday to Thursday.
# GitHub may start a scheduled run a few minutes late.  "Run workflow" (Actions tab) starts it at any time.
on:
  schedule:
    - cron: '0 5-16 * * 0-4'
  workflow_dispatch:

concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history: the newest file in drop/ is found by when it was added

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the Excel reader
        run: pip install openpyxl

      - name: Rebuild the app from the newest files in drop/
        run: python tools/update_site.py

      - name: Publish when something changed
        run: |
          git config user.name "pmo-bot-updater"
          git config user.email "pmo-bot-updater@users.noreply.github.com"
          git add -A index.html sw.js drop/.processed.json
          if git diff --cached --quiet; then
            echo "Nothing new - the published app is already up to date."
          else
            git commit -m "Auto-update from the drop folder ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
