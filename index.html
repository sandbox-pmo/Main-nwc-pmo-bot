<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>PMO Bot</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PMO Bot">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08211C">
<style>
:root{
  --wa-bg:#0B141A; --wa-header:#202C33; --wa-panel:#111B21;
  --bubble-in:#202C33; --bubble-out:#0F5C46; --text:#E9EDEF; --muted:#8696A0;
  --accent:#00A884; --card-bg:#0F1A20; --line:#2A3942;
  --green:#00C288; --amber:#FFC24B; --red:#FF6B6B;
  --saudi-green:#0B6E4F; --gold:#C9A96A; --water-blue:#1E5F8C;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --wa-bg:#E5DDD5; --wa-header:#008069; --wa-panel:#F0F2F5;
  --bubble-in:#FFFFFF; --bubble-out:#D9FDD3; --text:#111B21; --muted:#667781;
  --accent:#008069; --card-bg:#FFFFFF; --line:#E9EDEF;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0; background:var(--wa-panel); font-family:Calibri,Arial,sans-serif; min-height:100%; color:var(--text);}
.phone{max-width:460px; margin:0 auto; height:100vh; height:100dvh; display:flex; flex-direction:column; background:var(--wa-bg); box-shadow:0 0 40px rgba(0,0,0,.3);}

.header{background:linear-gradient(120deg, var(--saudi-green) 0%, var(--water-blue) 100%); color:#fff; padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top,0px)); display:flex; align-items:center; gap:12px; flex-shrink:0; position:relative;}
.avatar{width:40px; height:40px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.25); border:2px solid rgba(255,255,255,.85);}
.avatar img{width:100%; height:100%; object-fit:cover; display:block;}
.header .headtext{flex:1; min-width:0;}
.header .name{font-weight:bold; font-size:15px; line-height:1.25;}
.header .status{font-size:11px; opacity:.9;}
.logobar{display:flex; align-items:center; justify-content:center; gap:10px; background:#FFFFFF; padding:7px 12px; flex-shrink:0;}
.logochip{display:flex; align-items:center; height:26px;}
.logochip img{height:100%; width:auto; display:block; object-fit:contain;}
.logodivider{width:1px; height:20px; background:#D9DCE1; flex-shrink:0;}
.geopattern{height:6px; flex-shrink:0; background-color:var(--wa-bg);
  background-image: repeating-linear-gradient(45deg, var(--gold) 0, var(--gold) 3px, transparent 3px, transparent 9px),
                     repeating-linear-gradient(-45deg, var(--gold) 0, var(--gold) 3px, transparent 3px, transparent 9px);
  background-position: 0 0, 0 0; opacity:.55;
}

.typing{display:flex; gap:4px; align-items:center; padding:10px 12px; background:var(--bubble-in); border-radius:10px; border-top-left-radius:2px; align-self:flex-start; width:fit-content;}
.typing span{width:6px; height:6px; border-radius:50%; background:var(--muted); display:inline-block; animation:tbounce 1.2s infinite ease-in-out;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes tbounce{
  0%, 60%, 100%{ transform:translateY(0); opacity:.5; }
  30%{ transform:translateY(-4px); opacity:1; }
}

.thread{flex:1; overflow-y:auto; padding:14px 10px; display:flex; flex-direction:column; gap:8px;
  background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,.02) 0, transparent 40%);
}
.msg{max-width:86%; padding:8px 10px; border-radius:10px; font-size:13.5px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word;}
.msgrow{display:flex; align-items:flex-end; gap:7px; align-self:flex-start; max-width:90%;}
.msgavatar{width:26px; height:26px; border-radius:50%; flex-shrink:0; object-fit:cover; box-shadow:0 1px 3px rgba(0,0,0,.35); border:1.5px solid rgba(255,255,255,.7);}
.msgrow .msg{margin:0; max-width:100%;}
.msgrow .card{margin:0;}
.msg.in{background:var(--bubble-in); align-self:flex-start; border-top-left-radius:2px;}
.msg.out{background:var(--bubble-out); align-self:flex-end; border-top-right-radius:2px; color:var(--text);}
.msg .time{display:block; text-align:right; font-size:10px; color:var(--muted); margin-top:4px;}

.card{background:var(--card-bg); border:1px solid var(--line); border-radius:12px; border-top-left-radius:2px; padding:12px; width:92%; max-width:340px; align-self:flex-start; font-size:13px; overflow-wrap:break-word; word-break:break-word;}
.card.rag-tint-Green{background:linear-gradient(180deg, rgba(0,194,136,.14), var(--card-bg) 70px); border-color:rgba(0,194,136,.35);}
.card.rag-tint-Amber{background:linear-gradient(180deg, rgba(255,194,75,.16), var(--card-bg) 70px); border-color:rgba(255,194,75,.4);}
.card.rag-tint-Red{background:linear-gradient(180deg, rgba(255,107,107,.18), var(--card-bg) 70px); border-color:rgba(255,107,107,.45);}
.card .rag-strip{height:5px; border-radius:3px; margin-bottom:10px;}
.card .rag-Green{background:var(--green);} .card .rag-Amber{background:var(--amber);} .card .rag-Red{background:var(--red);}
.card .name-ar{direction:rtl; text-align:right; font-weight:bold; font-size:14.5px; line-height:1.4; margin-bottom:6px; overflow-wrap:break-word; word-break:break-word;}
.card .meta{color:var(--muted); font-size:11.5px; margin-bottom:10px;}
.card .row{display:flex; justify-content:space-between; padding:4px 0; border-top:1px solid var(--line); font-size:12.5px;}
.card .row:first-of-type{border-top:none;}
.card .row .l{color:var(--muted);}
.card .row .v{font-weight:bold; text-align:right; overflow-wrap:break-word; word-break:break-word; max-width:65%;}
.card .comp{display:flex; gap:6px; margin:8px 0;}
.card .comp .pill{flex:1; text-align:center; padding:5px 2px; border-radius:7px; font-size:11px;}
.card .comp .pill .n{font-weight:bold; font-size:14px; display:block;}
.pill-good{background:rgba(0,194,136,.15); color:var(--green);}
.pill-bad{background:rgba(255,107,107,.15); color:var(--red);}
.card .health{display:flex; align-items:center; gap:10px; margin:8px 0; padding:8px; border-radius:8px; background:rgba(255,255,255,.03);}
.card .health .num{font-size:26px; font-weight:bold;}
.card .attn{margin-top:10px; padding:8px 10px; border-radius:8px; font-size:11.5px; line-height:1.5;}
.attn-Green{background:rgba(0,194,136,.12); color:var(--green);}
.attn-Amber{background:rgba(255,194,75,.12); color:var(--amber);}
.attn-Red{background:rgba(255,107,107,.12); color:var(--red);}
.attn-ar{direction:rtl; display:inline;}

.optlist{margin-top:6px;}
.optbtn{display:block; width:100%; text-align:right; direction:rtl; background:rgba(255,255,255,.04); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:8px; margin-top:5px; font-size:12.5px; cursor:pointer;}
.optbtn:hover{background:rgba(255,255,255,.09);}
.optbtn .n{direction:ltr; display:inline-block; color:var(--accent); font-weight:bold; margin-left:6px;}

.voicebar{display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--wa-header); flex-shrink:0; border-top:1px solid rgba(255,255,255,.08);}
.voicebtn{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); color:#fff; width:30px; height:30px; border-radius:50%; font-size:14px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:0;}
.voicebtn.active{background:var(--accent); border-color:var(--accent);}
.voicebtn.listening{animation:pulse 1.2s infinite;}
.voicebtn.unsupported{opacity:.3; cursor:not-allowed;}
.langbtn{border-radius:8px; width:34px; font-size:10px; font-weight:bold;}
.voicehint{flex:1; font-size:10.5px; color:var(--muted); text-align:center;}
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(0,168,132,.5); }
  70%{ box-shadow:0 0 0 8px rgba(0,168,132,0); }
  100%{ box-shadow:0 0 0 0 rgba(0,168,132,0); }
}
.inputbar{display:flex; gap:8px; padding:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); background:var(--wa-header); flex-shrink:0;}
.inputbar input{flex:1; border:none; border-radius:20px; padding:10px 14px; font-size:14px; background:var(--card-bg); color:var(--text);}
.inputbar button{background:var(--accent); border:none; color:#fff; width:40px; height:40px; border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0;}
.quickrow{display:flex; gap:6px; padding:0 10px 8px; overflow-x:auto; flex-shrink:0;}
.quickchip{background:var(--wa-header); color:#fff; border:1px solid rgba(255,255,255,.15); padding:6px 12px; border-radius:16px; font-size:11.5px; white-space:nowrap; cursor:pointer;}
</style>
</head>

function timeNow(){
  const d = new Date();
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function scrollBottom(){
  const t = document.getElementById('thread');
  t.scrollTop = t.scrollHeight;
}

function addText(text, who){
  const t = document.getElementById('thread');
  const bubble = document.createElement('div');
  bubble.className = 'msg ' + who;
  bubble.innerHTML = text.replace(/\n/g,'<br>') + `<span class="time">${timeNow()}</span>`;
  if(who === 'in'){
    const row = document.createElement('div');
    row.className = 'msgrow';
    row.innerHTML = `<img class="msgavatar" src="${BOT_AVATAR}" alt="">`;
    row.appendChild(bubble);
    t.appendChild(row);
  } else {
    t.appendChild(bubble);
  }
  scrollBottom();
}

function showTyping(){
  const t = document.getElementById('thread');
  const row = document.createElement('div');
  row.className = 'msgrow';
  row.id = 'typingIndicator';
  row.innerHTML = `<img class="msgavatar" src="${BOT_AVATAR}" alt=""><div class="typing" aria-label="PMO Bot is typing"><span></span><span></span><span></span></div>`;
  t.appendChild(row);
  scrollBottom();
}

function hideTyping(){
  const el = document.getElementById('typingIndicator');
  if(el) el.remove();
}

function addOptions(matches, query){
  const t = document.getElementById('thread');
  const row = document.createElement('div');
  row.className = 'msgrow';
  const bubble = document.createElement('div');
  bubble.className = 'msg in';
  let html = `I found ${matches.length} projects matching "${query}". Which one?<div class="optlist">`;
  matches.slice(0,8).forEach((p,i)=>{
    html += `<button class="optbtn" data-num="${p.num}">${p.name} <span class="n">${p.num}</span></button>`;
  });
  html += `</div><span class="time">${timeNow()}</span>`;
  bubble.innerHTML = html;
  row.innerHTML = `<img class="msgavatar" src="${BOT_AVATAR}" alt="">`;
  row.appendChild(bubble);
  t.appendChild(row);
  bubble.querySelectorAll('.optbtn').forEach(b=>{
    b.addEventListener('click', ()=>{ handleQuery(b.dataset.num, true); });
  });

}

function norm(s){ return (s||'').toString().toLowerCase().trim(); }

// ---------- Smart query parsing: filler stripping + synonym/criteria detection ----------
const FILLER_PHRASES = [
  "can you show me","show me","find me","search for","what is","what's","whats",
  "give me","tell me about","look up","lookup","can you","please","i want to know",
  "i want","i need to know","i need","pull up","get me","check on","check",
  "status of","the status of","do you have","what about"
];

// trigger words the person might type/say, mapped to a canonical key
const STATUS_SYNONYMS = {
  "delayed":    ["delayed","late","behind","slipping","slow","running late"],
  "distressed": ["distressed","critical","trouble","troubled","struggling"],
  "suspended":  ["suspended","stopped","halted","paused","frozen","on hold","holding"],
  "withdrawn":  ["withdrawn","cancelled","canceled","terminated"],
  "completed":  ["completed","finished","done","closed","handover","handed over"],
  "ahead":      ["ahead","early"],
  "on track":   ["on track","ontrack","on-track","normal","regular","healthy"],
};
// actual substrings to test against projectStatus for each canonical key — not the same as the
// trigger words above (e.g. "handover" should match "Provisional Handover", not literal "completed")
const STATUS_MATCH = {
  "delayed":    ["delayed"],
  "distressed": ["distressed"],
  "suspended":  ["suspended"],
  "withdrawn":  ["withdrawn"],
  "completed":  ["completed","handover"],
  "ahead":      ["ahead"],
  "on track":   ["on track"],
};

const REGION_SYNONYMS = {
  "Madinah": ["madinah","al madinah","al-madinah","medina","madina"],
  "Tabuk":   ["tabuk"],
};

const STOPWORDS = /\b(project|projects|in|at|for|of|the|near|with|a|an|please|show|me|schedule|status|health|score|currently|right|now|is|are|that|are|all)\b/gi;

function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function stripFillers(q){
  let out = ' ' + q + ' ';
  [...FILLER_PHRASES].sort((a,b)=>b.length-a.length).forEach(f=>{
    out = out.replace(new RegExp('\\b'+escapeRe(f)+'\\b','g'), ' ');
  });
  return out.replace(/\s+/g,' ').trim();
}

function parseSmartQuery(qRaw){
  const padded = ' ' + norm(qRaw) + ' ';
  let ragFilter = null, statusKey = null, region = null;

  ['red','amber','green'].forEach(c=>{ if(padded.includes(' '+c+' ')) ragFilter = c[0].toUpperCase()+c.slice(1); });
  Object.entries(STATUS_SYNONYMS).forEach(([canon, words])=>{
    words.forEach(w=>{ if(padded.includes(' '+w+' ')) statusKey = canon; });
  });
  Object.entries(REGION_SYNONYMS).forEach(([canon, words])=>{
    words.forEach(w=>{ if(padded.includes(' '+w+' ')) region = canon; });
  });

  let remainder = stripFillers(norm(qRaw));
  const toStrip = [];
  if(ragFilter) toStrip.push(ragFilter.toLowerCase());
  if(statusKey) toStrip.push(...STATUS_SYNONYMS[statusKey]);
  if(region) toStrip.push(...REGION_SYNONYMS[region]);
  toStrip.forEach(w=>{ remainder = remainder.replace(new RegExp('\\b'+escapeRe(w)+'\\b','g'),' '); });
  remainder = remainder.replace(STOPWORDS,' ').replace(/\s+/g,' ').trim();

  return { ragFilter, statusKey, region, remainder };
}

// ---------- Fuzzy fallback (typo tolerance) ----------
function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  const dp = [];
  for(let i=0;i<=m;i++){ dp.push(new Array(n+1).fill(0)); dp[i][0]=i; }
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j-1],dp[i-1][j],dp[i][j-1]);
    }
  }
  return dp[m][n];
}

function fuzzyFind(qRaw){
  const qn = norm(qRaw);
  if(qn.length<3) return [];
  const threshold = qn.length<=4 ? 1 : qn.length<=7 ? 2 : 3;
  const scored = [];
  PROJECTS.forEach(p=>{
    const fields = [norm(p.num), ...norm(p.city).split(' '), ...norm(p.name).split(' ')].filter(Boolean);
    let best = Infinity;
    fields.forEach(f=>{ const d = levenshtein(qn, f); if(d<best) best = d; });
    if(best <= threshold) scored.push({p, dist:best});
  });
  scored.sort((a,b)=>a.dist-b.dist);
  return scored.slice(0,8).map(s=>s.p);
}

function findMatches(qRaw){
  const q = norm(qRaw);
  if(!q) return {type:'none'};

  // exact project number — fastest, unambiguous path
  let exact = PROJECTS.filter(p=>norm(p.num)===q);
  if(exact.length===1) return {type:'one', project:exact[0]};

  if(q==='help'){ return {type:'help'}; }

  // smart multi-criteria parse (handles natural phrasing: "red projects in tabuk", "delayed in madinah", etc.)
  const parsed = parseSmartQuery(qRaw);
  const filterCount = [parsed.ragFilter, parsed.statusKey, parsed.region].filter(Boolean).length;

  if(filterCount > 0){
    let list = PROJECTS.slice();
    if(parsed.ragFilter) list = list.filter(p=>p.rag===parsed.ragFilter);
    if(parsed.statusKey) list = list.filter(p=>STATUS_MATCH[parsed.statusKey].some(sub=>norm(p.projectStatus).includes(sub)));
    if(parsed.region) list = list.filter(p=>p.region===parsed.region);
    if(parsed.remainder){
      list = list.filter(p=>
        norm(p.name).includes(parsed.remainder) || norm(p.city).includes(parsed.remainder) ||
        norm(p.contractorName).includes(parsed.remainder) || norm(p.consultantName).includes(parsed.remainder)
      );
    }
    // simple single-criterion cases keep their original response shape for familiar replies
    if(filterCount===1 && !parsed.remainder){
      if(parsed.ragFilter) return {type:'rag', rag: parsed.ragFilter, list};
      if(parsed.region) return {type:'region', region: parsed.region, list};
    }
    const labelParts = [];
    if(parsed.statusKey) labelParts.push(parsed.statusKey);
    if(parsed.ragFilter) labelParts.push(parsed.ragFilter.toLowerCase());
    if(parsed.region) labelParts.push(`in ${parsed.region}`);
    if(parsed.remainder) labelParts.push(`matching "${parsed.remainder}"`);
    return { type:'filtered', label: labelParts.join(' '), list };
  }

  // region keyword alone (no other criteria detected above, e.g. just "Tabuk")
  const regions = [...new Set(PROJECTS.map(p=>p.region.toLowerCase()))];
  if(regions.includes(q)){
    const list = PROJECTS.filter(p=>p.region.toLowerCase()===q);
    return {type:'region', region: PROJECTS.find(p=>p.region.toLowerCase()===q).region, list};
  }

  // filler-stripped text so a question like "what is the status of O138" still resolves cleanly
  const cleaned = stripFillers(q) || q;

  // partial project number — check both the raw and filler-stripped query
  let partialNum = PROJECTS.filter(p=>norm(p.num).includes(q) || norm(p.num).includes(cleaned));
  if(partialNum.length===1) return {type:'one', project:partialNum[0]};
  if(partialNum.length>1) return {type:'many', list:partialNum};

  // name / city / contractor / consultant contains
  let byText = PROJECTS.filter(p=>
    norm(p.name).includes(cleaned) || norm(p.city).includes(cleaned) ||
    norm(p.contractorName).includes(cleaned) || norm(p.consultantName).includes(cleaned)
  );
  if(byText.length===1) return {type:'one', project:byText[0]};
  if(byText.length>1) return {type:'many', list:byText};

  // last resort: typo-tolerant fuzzy match
  const fuzzy = fuzzyFind(cleaned);
  if(fuzzy.length===1) return {type:'one', project:fuzzy[0], fuzzy:true};
  if(fuzzy.length>1) return {type:'many', list:fuzzy, fuzzy:true};

  return {type:'none'};
}

function handleQuery(qRaw, isNum){
  addText(qRaw, 'out');
  showTyping();
  const delay = 500 + Math.random()*400;
  setTimeout(()=>{
    hideTyping();
    const r = findMatches(qRaw);
    if(r.type==='help'){
      addText("I understand natural phrasing too — try things like:\n• \"red projects in Tabuk\"\n• \"delayed projects in Madinah\"\n• \"show me suspended projects\"\n\nOr the basics:\n• *Project number* — e.g. O138\n• *Project name keyword* — e.g. Yanbu, Badr\n• *City / Region* — e.g. Tabuk, Madinah\n• *red* / *amber* / *green* for a health band\n\n🎤 Tap the mic to speak your question, and toggle 🔊 to hear replies read aloud.", 'in');
      speakResponse("You can ask me by project number, name, city, or status. Try saying red projects in Tabuk, or delayed projects in Madinah.");
      return;
    }
    if(r.type==='none'){
      addText(`I couldn't find a project matching "${qRaw}". Try a project number, part of a name, a city/region, or a status like "delayed" or "suspended". Type *help* for examples.`, 'in');
      speakResponse(`I couldn't find a match for ${qRaw}. Try a project number, a city, or a status like delayed or suspended.`);
      return;
    }
    if(r.type==='one'){
      const prefix = r.fuzzy ? `Closest match for *"${qRaw}"* — here's *${r.project.num}*:` : `Here's the latest card for *${r.project.num}* (data as of 17 Sep 2026):`;
      addText(prefix, 'in');
      addCard(r.project);
      speakResponse(cardToSpeech(r.project));
      return;
    }
    if(r.type==='many'){
      speakResponse(`I found ${r.list.length} matching projects. Please pick one.`);
      addOptions(r.list, qRaw);
      return;
    }
    if(r.type==='filtered'){
      if(r.list.length===0){ addText(`No projects found ${r.label}.`, 'in'); speakResponse(`No projects found ${r.label}.`); return; }
      const counts = {Green:0,Amber:0,Red:0};
      r.list.forEach(p=>counts[p.rag]++);
      addText(`${r.list.length} project(s) ${r.label} — 🟢 ${counts.Green} · 🟠 ${counts.Amber} · 🔴 ${counts.Red}\n\nTap one for its full card:`, 'in');
      speakResponse(`Found ${r.list.length} projects ${r.label}.`);
      addOptions(r.list.slice(0,8), r.label);
      return;
    }
    if(r.type==='region'){
      const counts = {Green:0,Amber:0,Red:0};
      r.list.forEach(p=>counts[p.rag]++);
      addText(`${r.region}: ${r.list.length} projects — 🟢 ${counts.Green} · 🟠 ${counts.Amber} · 🔴 ${counts.Red}\n\nReply with a project number, or try "red in ${r.region}" — or tap one below:`, 'in');
      speakResponse(`${r.region} has ${r.list.length} projects: ${counts.Green} green, ${counts.Amber} amber, and ${counts.Red} red.`);
      addOptions(r.list.filter(p=>p.rag!=='Green').concat(r.list.filter(p=>p.rag==='Green')).slice(0,8), r.region);
      return;
    }
    if(r.type==='rag'){
      if(r.list.length===0){ addText(`No ${r.rag} projects right now — good news!`, 'in'); speakResponse(`No ${r.rag} projects right now. Good news.`); return; }
      addText(`${r.list.length} project(s) currently ${r.rag}:`, 'in');
      speakResponse(`${r.list.length} projects are currently ${r.rag}.`);
      addOptions(r.list, r.rag);
      return;
    }
  }, delay);
}

document.getElementById('sendBtn').addEventListener('click', ()=>{
  const inp = document.getElementById('inp');
  if(inp.value.trim()){ handleQuery(inp.value.trim()); inp.value=''; }
});
document.getElementById('inp').addEventListener('keydown', (e)=>{
  if(e.key==='Enter'){ document.getElementById('sendBtn').click(); }
});
document.querySelectorAll('.quickchip').forEach(c=>{
  c.addEventListener('click', ()=>{ handleQuery(c.dataset.q); });
  c.addEventListener('keydown', (e)=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); handleQuery(c.dataset.q); }
  });
});

// ============================================================
// Voice output (text-to-speech)
// ============================================================
let voiceOutputEnabled = false;
const speakToggleBtn = document.getElementById('speakToggleBtn');

function cleanForSpeech(text){
  return text.replace(/\*/g,'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').replace(/\s+/g,' ').trim();
}

function speakResponse(text){
  if(!voiceOutputEnabled) return;
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(cleanForSpeech(text));
  utter.lang = 'en-US';
  utter.rate = 1.0;
  window.speechSynthesis.speak(utter);
}

function cardToSpeech(p){
  const svPart = p.sv>0 ? `running ${p.sv} points behind schedule` : p.sv<0 ? `running ${Math.abs(p.sv)} points ahead of schedule` : `on schedule`;
  return `Project ${p.num}, status ${p.projectStatus}. Health score ${p.health} out of 100. ${svPart}. Contract value ${p.value} million riyals, ${p.elapsed} percent of duration elapsed.`;
}

if(speakToggleBtn){
  speakToggleBtn.addEventListener('click', ()=>{
    voiceOutputEnabled = !voiceOutputEnabled;
    speakToggleBtn.textContent = voiceOutputEnabled ? '🔊' : '🔇';
    speakToggleBtn.classList.toggle('active', voiceOutputEnabled);
    speakToggleBtn.title = voiceOutputEnabled ? 'Spoken replies: on' : 'Spoken replies: off';
    if(!voiceOutputEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    if(voiceOutputEnabled) speakResponse('Spoken replies are now on.');
  });
}

// ============================================================
// Voice input (speech-to-text)
// ============================================================
const micBtn = document.getElementById('micBtn');
const langBtn = document.getElementById('langBtn');
const voiceHint = document.getElementById('voiceHint');
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recogLang = 'en-US';
let recognition = null;
let isListening = false;

if(SpeechRecognitionAPI){
  recognition = new SpeechRecognitionAPI();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = ()=>{
    isListening = true;
    micBtn.classList.add('listening','active');
    voiceHint.textContent = recogLang==='ar-SA' ? 'Listening… (Arabic)' : 'Listening…';
  };
  recognition.onend = ()=>{
    isListening = false;
    micBtn.classList.remove('listening','active');
    voiceHint.textContent = 'Tap 🎤 to ask by voice';
  };
  recognition.onerror = (e)=>{
    isListening = false;
    micBtn.classList.remove('listening','active');
    voiceHint.textContent = e.error==='not-allowed' ? 'Microphone permission denied' : 'Tap 🎤 to ask by voice';
  };
  recognition.onresult = (e)=>{
    const transcript = e.results[0][0].transcript;
    const inp = document.getElementById('inp');
    inp.value = transcript;
    handleQuery(transcript);
    inp.value = '';
  };

  micBtn.addEventListener('click', ()=>{
    if(isListening){ recognition.stop(); return; }
    recognition.lang = recogLang;
    try{ recognition.start(); } catch(err){ /* already running */ }
  });

  langBtn.addEventListener('click', ()=>{
    recogLang = recogLang==='en-US' ? 'ar-SA' : 'en-US';
    langBtn.textContent = recogLang==='en-US' ? 'EN' : 'AR';
    langBtn.title = `Voice recognition language: ${recogLang==='en-US' ? 'English' : 'Arabic'}`;
  });
} else {
  micBtn.classList.add('unsupported');
  micBtn.disabled = true;
  micBtn.title = 'Voice input is not supported in this browser';
  langBtn.style.display = 'none';
  voiceHint.textContent = 'Voice input not supported on this browser';
}
