<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>PMO Bot</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PMO Bot">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#08211C">
<style>
:root{
  --wa-bg:#0B141A; --wa-header:#202C33; --wa-panel:#111B21;
  --bubble-in:#202C33; --bubble-out:#0F5C46; --text:#E9EDEF; --muted:#8696A0;
  --accent:#00A884; --card-bg:#0F1A20; --line:#2A3942;
  --saudi-green:#0B6E4F; --gold:#C9A96A; --water-blue:#1E5F8C;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0; background:var(--wa-panel); font-family:Calibri,"Segoe UI",Arial,sans-serif; min-height:100%; color:var(--text);}
.phone{max-width:460px; margin:0 auto; height:100vh; height:100dvh; display:flex; flex-direction:column; background:var(--wa-bg); box-shadow:0 0 40px rgba(0,0,0,.3);}

/* ---------- header / branding ---------- */
.header{background:linear-gradient(120deg, var(--saudi-green) 0%, var(--water-blue) 100%); color:#fff; padding:6px 12px 6px 14px; padding-top:calc(6px + env(safe-area-inset-top,0px)); display:flex; align-items:center; gap:12px; flex-shrink:0; position:relative;}
.avatar{width:78px; height:90px; flex-shrink:0; display:flex; align-items:center; justify-content:center; filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));}
.avatar svg{width:100%; height:100%; display:block; overflow:visible;}
.header .headtext{flex:1; min-width:0;}
.header .name{font-weight:bold; font-size:19px; line-height:1.25;}
.header .status{font-size:11.5px; opacity:.92; line-height:1.35;}
.brandstack{display:flex; flex-direction:column; gap:4px; width:86px; flex-shrink:0;}
.brand{border-radius:8px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.4);}
.brand.nwc{background:#09336C; line-height:0;}
.brand.nwc img{display:block; width:100%; height:auto;}
.brand.hill{background:#FFFFFF; height:24px; display:flex; align-items:center; justify-content:center;}
.brand.hill img{height:19px; width:auto; display:block;}
@media (max-width:360px){ .brandstack{width:76px;} .brand.hill{height:22px;} .brand.hill img{height:17px;} }
.geopattern{height:6px; flex-shrink:0; background-color:var(--wa-bg);
  background-image: repeating-linear-gradient(45deg, var(--gold) 0, var(--gold) 3px, transparent 3px, transparent 9px),
                     repeating-linear-gradient(-45deg, var(--gold) 0, var(--gold) 3px, transparent 3px, transparent 9px);
  opacity:.55;
}

/* ---------- animated avatar: head, scarf, robe, eyes, brows and smile all move (clearly visible) ---------- */
@keyframes avFloat   { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-3px);} }
@keyframes avHead    { 0%,100%{transform:rotate(-3.5deg) translateY(0);} 50%{transform:rotate(3.5deg) translateY(-1.8px);} }
/* scarf: the top stays pinned and the hem drifts slowly (shear), like cloth - not a pendulum swing */
@keyframes avSwayL   { 0%,100%{transform:skewX(-2.3deg) rotate(-.5deg);} 50%{transform:skewX(2.3deg) rotate(.5deg);} }
@keyframes avSwayR   { 0%,100%{transform:skewX(2.3deg) rotate(.5deg);}  50%{transform:skewX(-2.3deg) rotate(-.5deg);} }
@keyframes avBreathe { 0%,100%{transform:scale(1,1) skewX(-2.5deg);} 50%{transform:scale(1.05,1.035) skewX(2.5deg);} }
@keyframes avLook    { 0%,10%{transform:translateX(0);} 18%,36%{transform:translateX(-1.7px);} 46%,54%{transform:translateX(0);} 62%,82%{transform:translateX(1.7px);} 92%,100%{transform:translateX(0);} }
@keyframes avatarBlink { 0%,86%,100%{transform:scaleY(1);} 89%{transform:scaleY(.05);} 92%{transform:scaleY(1);} 94%{transform:scaleY(.05);} 97%{transform:scaleY(1);} }
@keyframes avBrow    { 0%,86%,100%{transform:translateY(0);} 89%,95%{transform:translateY(-1.8px);} }
@keyframes avSmile   { 0%,58%,100%{transform:scale(1,1);} 68%,82%{transform:scale(1.2,1.5);} }
.av-float{ animation:avFloat 3.2s ease-in-out infinite; }
.av-head { transform-box:view-box; transform-origin:60px 88px; animation:avHead 4.4s ease-in-out infinite; }
.avatar-drape-l{ transform-box:fill-box; transform-origin:85% 0%; animation:avSwayL 5.6s ease-in-out infinite; }
.avatar-drape-r{ transform-box:fill-box; transform-origin:15% 0%; animation:avSwayR 6.4s ease-in-out infinite; }
.avatar-robe{ transform-box:fill-box; transform-origin:50% 100%; animation:avBreathe 3.4s ease-in-out infinite; }
.av-eyes { animation:avLook 7s ease-in-out infinite; }
.avatar-eye{ transform-box:fill-box; transform-origin:center; animation:avatarBlink 3.6s ease-in-out infinite; }
.av-brows{ animation:avBrow 3.6s ease-in-out infinite; }
.av-mouth{ transform-box:fill-box; transform-origin:center; animation:avSmile 5.5s ease-in-out infinite; }
/* Reduce-motion setting: keep only the blink (no large movement) */
@media (prefers-reduced-motion: reduce){ .av-float,.av-head,.avatar-drape-l,.avatar-drape-r,.avatar-robe,.av-eyes,.av-brows,.av-mouth,.typing span{ animation:none; } }

/* ---------- chat thread ---------- */
.thread{position:relative; flex:1; overflow-y:auto; padding:14px 10px; display:flex; flex-direction:column; gap:8px; -webkit-overflow-scrolling:touch;
  background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,.02) 0, transparent 40%);
}
.msg{max-width:86%; padding:8px 10px; border-radius:10px; font-size:13.5px; line-height:1.5; word-wrap:break-word; overflow-wrap:anywhere;}
.msgrow{display:flex; align-items:flex-end; gap:7px; align-self:flex-start; max-width:92%;}
.msgrow.wide{max-width:100%; width:100%; align-items:flex-start;}
.msgavatar{width:40px; height:46px; flex-shrink:0; display:inline-block; filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));}
.msgavatar svg{width:100%; height:100%; display:block; overflow:visible;}
@media (max-width:360px){ .msgavatar{width:32px; height:37px;} .avatar{width:64px; height:74px;} .header .name{font-size:17px;} }
.msgrow .msg{margin:0; max-width:100%;}
.msg.in{background:var(--bubble-in); align-self:flex-start; border-top-left-radius:2px;}
.msg.out{background:var(--bubble-out); align-self:flex-end; border-top-right-radius:2px; color:var(--text);}
.msg .time{display:block; text-align:right; font-size:10px; color:var(--muted); margin-top:4px;}
.typing{display:flex; gap:4px; align-items:center; padding:10px 12px; background:var(--bubble-in); border-radius:10px; border-top-left-radius:2px; width:fit-content;}
.typing span{width:6px; height:6px; border-radius:50%; background:var(--muted); display:inline-block; animation:tbounce 1.2s infinite ease-in-out;}
.typing span:nth-child(2){animation-delay:.15s;}
.typing span:nth-child(3){animation-delay:.3s;}
@keyframes tbounce{ 0%,60%,100%{transform:translateY(0); opacity:.5;} 30%{transform:translateY(-4px); opacity:1;} }

/* ---------- project control card ---------- */
.card{--st:#4DA3FF; --st-a:rgba(77,163,255,.15); --st-b:rgba(77,163,255,.45);
  flex:1; min-width:0; background:linear-gradient(180deg, var(--st-a), var(--card-bg) 110px); border:1px solid var(--st-b);
  border-radius:12px; border-top-left-radius:2px; padding:12px; font-size:13px; overflow-wrap:anywhere;}
.card.st-ahead  {--st:#2ED39B; --st-a:rgba(46,211,155,.15);  --st-b:rgba(46,211,155,.45);}
.card.st-ontrack{--st:#4DA3FF; --st-a:rgba(77,163,255,.15);  --st-b:rgba(77,163,255,.45);}
.card.st-delay  {--st:#FFB020; --st-a:rgba(255,176,32,.16);  --st-b:rgba(255,176,32,.5);}
.card.st-trouble{--st:#FF5C5C; --st-a:rgba(255,92,92,.17);   --st-b:rgba(255,92,92,.5);}
.card.st-susp   {--st:#B58CFF; --st-a:rgba(181,140,255,.17); --st-b:rgba(181,140,255,.5);}
.card.st-completed{--st:#8FA3B3; --st-a:rgba(143,163,179,.16); --st-b:rgba(143,163,179,.45);}
.card.pf{--st:#C9A96A; --st-a:rgba(201,169,106,.14); --st-b:rgba(201,169,106,.45);}
.card .strip{height:5px; border-radius:3px; margin-bottom:10px; background:var(--st);}
.chead{display:flex; justify-content:space-between; align-items:center; gap:6px 8px; margin-bottom:8px; flex-wrap:wrap;}
.schip{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:var(--st-a); color:var(--st); border:1px solid var(--st-b); font-weight:700; font-size:12px; white-space:nowrap;}
.schip .dotc{width:8px; height:8px; border-radius:50%; background:var(--st);}
.po{font-size:11px; color:var(--muted); text-align:right; line-height:1.25; margin-left:auto; white-space:nowrap; flex-shrink:0;}
.po b{display:block; color:var(--text); font-size:13.5px; letter-spacing:.4px;}
.po small{display:block; font-size:10px; opacity:.85;}
.name-ar{direction:rtl; text-align:right; font-weight:700; font-size:15px; line-height:1.5; margin:2px 0 4px;}
.meta{color:var(--muted); font-size:11px; margin-bottom:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
.meta .sep{opacity:.5;}
.lbl small,.sh small,.tile .ta{font-family:inherit;}
.prow{display:flex; justify-content:space-between; gap:10px; padding:7px 0; border-top:1px solid var(--line); font-size:12.5px;}
.prow .l{color:var(--muted); flex-shrink:0; max-width:40%; line-height:1.3;}
.prow .l small{display:block; font-size:10px; opacity:.85; direction:rtl; text-align:left;}
.prow .v{font-weight:600; text-align:right; direction:rtl; flex:1; line-height:1.45;}
.dates{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0 6px;}
.dtile{background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:8px; padding:7px 9px; min-width:0;}
.dtile .dv{font-weight:700; font-size:13px; margin-bottom:2px;}
.dtile .dl{font-size:9.5px; color:var(--text); opacity:.85; line-height:1.25;}
.dtile .da{font-size:9px; color:var(--muted); line-height:1.25; direction:rtl; text-align:right;}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:6px 0 4px;}
.tile{background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:8px; padding:7px 7px 6px; display:flex; flex-direction:column; min-width:0;}
.tile .tv{font-weight:800; font-size:15px; line-height:1.2; margin-bottom:3px; min-height:18px;}
.tile .tv.ar{direction:rtl; text-align:right; font-size:12px; font-weight:700; line-height:1.35;}
.tile .tl{font-size:9.5px; color:var(--text); opacity:.85; line-height:1.25;}
.tile .ta{font-size:9px; color:var(--muted); line-height:1.3; direction:rtl; text-align:right; margin-top:1px; flex:1;}
.tile .bar{height:3px; border-radius:2px; background:rgba(255,255,255,.1); margin-top:5px; overflow:hidden;}
.tile .bar i{display:block; height:100%; background:var(--bc,var(--st)); border-radius:2px;}
.neg{color:#FF8E8E;} .pos{color:#4EE0A8;} .warn{color:#FFB020;} .bad{color:#FF6B6B;} .good{color:#4EE0A8;} .mute{color:var(--muted);}
.sec{margin-top:10px; padding-top:9px; border-top:1px solid var(--line);}
.sh{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:6px;}
.sh b{font-size:11.5px; color:var(--gold); line-height:1.25;}
.sh small{font-size:10px; color:var(--muted); direction:rtl; text-align:right; line-height:1.25;}
.sb{direction:rtl; text-align:right; font-size:12.5px; line-height:1.7;}
.sb ol{margin:0; padding:0; list-style:none;}
.sb li{display:flex; gap:7px; margin:0 0 6px; align-items:flex-start;}
.sb li .n{flex-shrink:0; width:18px; height:18px; border-radius:50%; background:var(--st-a); color:var(--st); border:1px solid var(--st-b); font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:3px;}
.sb p{margin:0;}
.sb .none{color:var(--muted);}
.clamp{max-height:10.2em; overflow:hidden; position:relative;}
.clamp.open{max-height:none;}
.clamp.has-more:not(.open)::after{content:''; position:absolute; left:0; right:0; bottom:0; height:2.6em; background:linear-gradient(rgba(15,26,32,0), var(--card-bg));}
.more{display:none; background:none; border:0; color:var(--accent); font-size:11.5px; padding:5px 0 0; cursor:pointer; font-family:inherit;}
.clamp.has-more + .more{display:inline-block;}


/* ---------- last-update list (newest first) ---------- */
.subnote{font-size:10px; color:var(--muted); margin:-2px 0 6px; direction:ltr; text-align:left;}
.dchip{display:block; width:fit-content; direction:ltr; font-size:10px; font-weight:700; color:var(--st); background:var(--st-a); border:1px solid var(--st-b); border-radius:999px; padding:0 8px; margin:2px 0 3px; line-height:1.55;}
.sb li .ut{flex:1; min-width:0;}
.older[hidden]{display:none;}
.older{margin-top:2px;}
.olderbtn{background:none; border:0; color:var(--accent); font-size:11.5px; padding:2px 0 0; cursor:pointer; font-family:inherit;}

/* ---------- portfolio dashboard ---------- */
.pfhead .t{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
.pfhead b{font-size:15px;}
.pfhead small{font-size:11px; color:var(--muted); direction:rtl; text-align:right;}
.pfhead .d{font-size:10.5px; color:var(--muted); margin:2px 0 10px;}
.totalbox{display:flex; align-items:center; gap:14px; background:rgba(255,255,255,.05); border:1px solid var(--st-b); border-radius:10px; padding:10px 14px; margin-bottom:8px;}
.totalbox .tn{font-size:36px; font-weight:800; line-height:1; color:var(--gold);}
.totalbox .tt b{display:block; font-size:12.5px;}
.totalbox .tt small{display:block; font-size:10.5px; color:var(--muted); direction:rtl; text-align:left;}
.brow{display:block; width:100%; text-align:left; background:none; border:0; padding:6px 4px; color:var(--text); cursor:pointer; font-family:inherit; border-radius:6px;}
.brow:hover:not(:disabled){background:rgba(255,255,255,.06);}
.brow:disabled{cursor:default; opacity:.7;}
.btop{display:flex; justify-content:space-between; align-items:baseline; gap:8px; margin-bottom:4px;}
.bl b{font-size:12px;} .bl small{font-size:10.5px; color:var(--muted); margin-left:6px; direction:rtl;}
.bn b{font-size:15px; color:var(--bc);}
.btrack{height:10px; border-radius:5px; background:rgba(255,255,255,.08); overflow:hidden;}
.btrack i{display:block; height:100%; border-radius:5px; background:var(--bc);}
.c-ahead{--bc:#2ED39B;} .c-ontrack{--bc:#4DA3FF;} .c-delay{--bc:#FFB020;} .c-trouble{--bc:#FF5C5C;} .c-susp{--bc:#B58CFF;} .c-completed{--bc:#8FA3B3;}
.bhint{font-size:10px; color:var(--muted); margin:2px 4px 0;}
.pfsec{margin-top:12px; padding-top:10px; border-top:1px solid var(--line);}
.grid.g2{grid-template-columns:1fr 1fr;}
.tile .tv.big{font-size:20px; margin-bottom:4px;}
.tile .tv .u{font-size:11px; font-weight:700; opacity:.8; margin-left:3px;}
.v-blue{color:#6FB7FF;}
.quickchip.hl{border-color:var(--gold); color:#fff; background:rgba(201,169,106,.18);}

/* ---------- option lists ---------- */
.optlist{margin-top:6px;}
.optbtn{display:block; width:100%; text-align:left; background:rgba(255,255,255,.04); border:1px solid var(--line); color:var(--text); padding:8px 10px; border-radius:8px; margin-top:5px; font-size:12.5px; cursor:pointer; font-family:inherit;}
.optbtn:hover{background:rgba(255,255,255,.09);}
.optbtn .on{display:block; direction:rtl; text-align:right; line-height:1.45; margin-bottom:3px;}
.optbtn .oi{display:flex; align-items:center; gap:6px; font-size:10.5px; color:var(--muted);}
.optbtn .oi b{color:var(--accent);}
.optmore{font-size:11px; color:var(--muted); margin-top:6px; line-height:1.4;}

/* ---------- voice + input ---------- */
.quickrow{display:flex; gap:6px; padding:0 10px 8px; overflow-x:auto; flex-shrink:0; -webkit-overflow-scrolling:touch;}
.quickchip{background:var(--wa-header); color:#fff; border:1px solid rgba(255,255,255,.15); padding:6px 12px; border-radius:16px; font-size:11.5px; white-space:nowrap; cursor:pointer;}
.voicebar{display:flex; align-items:center; gap:8px; padding:4px 10px; background:var(--wa-header); flex-shrink:0; border-top:1px solid rgba(255,255,255,.08);}
/* the microphone is a wide 44px-high pill that fills the bar - an easy target for a thumb */
.micwide{flex:1; min-width:0; height:44px; border-radius:22px; display:flex; align-items:center; justify-content:center; gap:9px; padding:0 14px;
  background:rgba(0,168,132,.2); border:1.5px solid var(--accent); color:#fff; font-family:inherit; font-size:14px; font-weight:600; line-height:1.1;
  cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent;}
.micwide:active{background:rgba(0,168,132,.4);}
.micwide .micico{font-size:20px; line-height:1; flex-shrink:0;}
.micwide #voiceHint{text-align:center; line-height:1.15; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}   /* long status text wraps to 2 lines, never cut off */
.micwide.active{background:var(--accent);}
.micwide.listening{animation:pulse 1.2s infinite;}
.micwide.unsupported{opacity:.35; cursor:not-allowed;}
.voicebtn{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); color:#fff; width:44px; height:44px; border-radius:50%; font-size:17px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:0; touch-action:manipulation;}
.voicebtn.active{background:var(--accent); border-color:var(--accent);}
.langbtn{border-radius:14px; font-size:12px; font-weight:bold;}
@keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(0,168,132,.5);} 70%{box-shadow:0 0 0 8px rgba(0,168,132,0);} 100%{box-shadow:0 0 0 0 rgba(0,168,132,0);} }
.inputbar{display:flex; gap:8px; padding:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom,0px)); background:var(--wa-header); flex-shrink:0;}
.inputbar input{flex:1; border:none; border-radius:20px; padding:10px 14px; font-size:16px; background:var(--card-bg); color:var(--text); min-width:0;}
.inputbar button{background:var(--accent); border:none; color:#fff; width:40px; height:40px; border-radius:50%; font-size:16px; cursor:pointer; flex-shrink:0;}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="avatar" aria-hidden="true" id="headerAvatarSlot"></div>
    <div class="headtext">
      <div class="name">PMO Bot</div>
      <div class="status">online &middot; Northwestern Cluster<br>Data to 1 Oct 2026</div>

/* =====================================================================
   Search: Arabic/English normalisation, filters, aliases, typo tolerance
   ===================================================================== */
function nrm(s){
  s = (s==null ? '' : String(s)).toLowerCase();
  s = s.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  s = s.replace(/[\u064B-\u065F\u0670\u0640]/g, '');                       // diacritics + tatweel
  s = s.replace(/[إأآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');
  s = s.replace(/[“”"'`’‘()\[\]{}.,;:!?\/\\|،؛؟_+*=<>~^]/g, ' ');
  return s.replace(/\s+/g,' ').trim();
}
PROJECTS.forEach(p => { p._s = nrm([p.po, p.pno, p.name, p.contractor, p.consultant].join(' ')); });

const VOCAB = (() => {
  const m = new Set();
  PROJECTS.forEach(p => nrm([p.name, p.contractor, p.consultant].join(' ')).split(' ').forEach(w => { if(w.length>=3 && !/^\d+$/.test(w)) m.add(w); }));
  return [...m];
})();

function reEsc(x){ return x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function trigRe(phrase, g){
  const ar = /[\u0600-\u06FF]/.test(phrase);
  const pre = ar ? '(?:وال|بال|لل|ال|و|ب|ل|ف|ك)?' : '';
  return new RegExp('(^|\\s)' + pre + reEsc(phrase) + '(?=\\s|$)', g ? 'g' : '');
}

  'and','or','to','by','on','po','no','number','list','any','which','المشاريع','مشاريع','المشروع','مشروع','في','حاله','موقف','كم','عدد','ما','هي','هو'].map(nrm));

function levenshtein(a,b){
  const m=a.length, n=b.length;
  if(!m) return n; if(!n) return m;
  let prev = Array.from({length:n+1}, (_,j)=>j);
  for(let i=1;i<=m;i++){
    const cur=[i];
    for(let j=1;j<=n;j++){
      cur[j] = a[i-1]===b[j-1] ? prev[j-1] : 1+Math.min(prev[j-1], prev[j], cur[j-1]);
    }
    prev = cur;
  }
  return prev[n];
}
function fixToken(t){
  if(PROJECTS.some(p => p._s.includes(t))) return t;       // already valid somewhere in the dataset
  if(t.length < 3) return t;
  const thr = t.length<=4 ? 1 : t.length<=7 ? 2 : 3;
  let best=null, bd=1e9;
  VOCAB.forEach(w => { const d=levenshtein(t,w); if(d<bd){bd=d; best=w;} });
  ALIASES.forEach(a => { if(a.key.indexOf(' ')<0){ const d=levenshtein(t,a.key); if(d<bd){bd=d; best=a.ar;} } });
  return bd<=thr ? best : t;
}

function parseQuery(q){
  let s = ' ' + q + ' ';
  FILLERS.forEach(f => { s = s.split(' '+f+' ').join('  '); });
  const F = {status:new Set(), flag:new Set(), area:new Set(), cls:new Set()};
  TRIGS.forEach(t => { if(t.re.test(s)){ F[t.kind].add(t.val); s = s.replace(t.reg, ' '); } });
  ALIASES.forEach(a => { s = s.replace(a.re, '$1' + a.ar); });
  const tokens = s.split(' ').filter(w => w && !STOP.has(w) && /[\p{L}\p{N}]/u.test(w));
  return {F, tokens};
}

function describe(F, tokens){
  const parts = [];
  if(F.status.size) parts.push([...F.status].map(k=>STATUS_NAME[k]).join(' / '));
  if(F.flag.size)   parts.push([...F.flag].map(k=>FLAG_NAME[k]).join(' + '));
  if(F.area.size)   parts.push('in ' + [...F.area].join(' / '));
  if(F.cls.size)    parts.push('class ' + [...F.cls].join(' / '));
  if(tokens.length) parts.push('matching “' + tokens.join(' ') + '”');
  return parts.join(' · ');
}

const PF_CORE = new Set(['portfolio','dashboard','summary','overview','overall','kpi','kpis','stats','statistics','invoice','invoices','budget','total','distribution','chart','charts','المحفظه','لوحه','ملخص','المستخلصات','الميزانيه'].map(nrm));
const PF_EXTRA = new Set(['update','updates','updated','latest','current','weekly','control','report','the','of'].map(nrm));
function isPortfolioQuery(q){
  const toks = q.split(' ').filter(w => w && !STOP.has(w));
  return toks.length > 0 && toks.every(w => PF_CORE.has(w) || PF_EXTRA.has(w)) && toks.some(w => PF_CORE.has(w));
}

function search(qRaw){
  const raw = String(qRaw||'').trim();
  const q = nrm(raw);
  if(!q) return {type:'none'};
  if(/^(help|مساعده|عون)$/.test(q) || raw === '?' || raw === '؟') return {type:'help'};
  if(/^(hi|hello|hey|salam|salaam|مرحبا|اهلا|السلام عليكم|سلام)$/.test(q)) return {type:'help', greeting:true};
  if(/^(red|amber|green)( projects?)?$/.test(q)) return {type:'raghint'};
  if(isPortfolioQuery(q)) return {type:'portfolio'};

  // 1) exact PO or project number
  const compact = q.replace(/\s+/g,'');
  let hit = PROJECTS.find(p => p.po === compact || nrm(p.pno).replace(/\s+/g,'') === compact);
  if(!hit){ const m = q.match(/(?:^|\s)(\d{9})(?=\s|$)/); if(m) hit = PROJECTS.find(p => p.po === m[1]); }
  if(hit) return {type:'one', project:hit, how:'po'};

  // 2) filters + free-text tokens
  const {F, tokens: tk0} = parseQuery(q);
  let tokens = tk0.slice();
  let list = PROJECTS.slice();
  if(F.status.size) list = list.filter(p => [...F.status].some(k => STATUS_TEST[k](p)));
  if(F.area.size)   list = list.filter(p => F.area.has(p.areaEn));
  if(F.cls.size)    list = list.filter(p => F.cls.has(p.cls));
  if(F.flag.size)   list = list.filter(p => [...F.flag].every(k => FLAG_TEST[k](p)));
  const hasFilter = F.status.size || F.flag.size || F.area.size || F.cls.size;

  let fuzzy = false;
  if(tokens.length){
    let r = list.filter(p => tokens.every(t => p._s.includes(t)));
    if(!r.length){
      const fixed = tokens.map(fixToken);
      if(fixed.some((x,i) => x !== tokens[i])){
        tokens = fixed; fuzzy = true;
        r = list.filter(p => tokens.every(t => p._s.includes(t)));
      }
    }
    list = r;
  }
  if(!hasFilter && !tokens.length) return {type:'none'};

  const label = describe(F, tokens);
  if(F.flag.has('zero')) list.sort((a,b) => (b.zero-a.zero) || (a.ord-b.ord)); else list.sort((a,b) => a.ord-b.ord);
  if(list.length === 1) return {type:'one', project:list[0], how: fuzzy ? 'fuzzy' : 'filter', label};
  if(list.length === 0) return {type:'none', label, hasFilter:!!hasFilter};
  return {type:'list', list, label, fuzzy};
}

}
function forecastCell(f){
  if(f.d) return {v: fmtDate(f.d), cls:'', ar:false};
  const t = f.t || '—';
  if(t.indexOf('غير متوقع') >= 0) return {v: esc(t), cls:'good', ar:true};
  if(t.indexOf('متعثر') >= 0)     return {v: esc(t), cls:'bad',  ar:true};
  return {v: esc(t), cls:'warn', ar:true};
}
function section(l, items){
  const none = items.length===1 && /^لا (يوجد|توجد)/.test(items[0]);
  let body;
  if(!items.length)            body = '<p class="none">—</p>';
  else if(items.length===1)    body = `<p class="${none?'none':''}">${esc(items[0])}</p>`;
  else body = '<ol>' + items.map((x,i) => `<li><span class="n">${i+1}</span><span>${esc(x)}</span></li>`).join('') + '</ol>';
  return `<div class="sec"><div class="sh"><b>${l[0]}</b><small>${l[1]}</small></div>` +
         `<div class="sb"><div class="clamp">${body}</div><button class="more" aria-expanded="false">Show more ▾</button></div></div>`;
}

  const l = LBL.upd;
  const chip = x => x.d ? `<span class="dchip">${fmtDate(x.d)}</span>` : '';
  const li = (x,i) => `<li><span class="n">${i+1}</span><span class="ut">${chip(x)}${esc(x.t)}</span></li>`;
  let body, note = '';
  if(!items.length){
    body = '<p class="none">—</p>';
  } else if(items.length === 1){
    const none = /^لا (يوجد|توجد)/.test(items[0].t);
    body = `<p class="${none?'none':''}">${chip(items[0])}${esc(items[0].t)}</p>`;
  } else {
    const vis = items.slice(0, UPD_VISIBLE), old = items.slice(UPD_VISIBLE);
    body = '<ol>' + vis.map(li).join('') + '</ol>';
    if(old.length){
      body += `<div class="older" hidden><ol>${old.map((x,i) => li(x, i+UPD_VISIBLE)).join('')}</ol></div>` +
              `<button class="olderbtn" data-n="${old.length}" aria-expanded="false">Show ${old.length} earlier update${old.length>1?'s':''} ▾</button>`;
    }
    note = `Newest first${old.length ? ` · latest ${UPD_VISIBLE} of ${items.length}` : ''}`;
  }
  return `<div class="sec"><div class="sh"><b>${l[0]}</b><small>${l[1]}</small></div>${note ? `<div class="subnote">${note}</div>` : ''}<div class="sb">${body}</div></div>`;

    <div class="dates">
      <div class="dtile"><div class="dv">${fmtDate(p.start)}</div><div class="dl">${LBL.start[0]}</div><div class="da">${LBL.start[1]}</div></div>
      <div class="dtile"><div class="dv">${fmtDate(p.end)}</div><div class="dl">${LBL.end[0]}</div><div class="da">${LBL.end[1]}</div></div>
    </div>
    <div class="grid">${tiles}</div>
    ${section(LBL.mgmt, p.mgmt)}${updSection(p.upd)}${section(LBL.tech, p.tech)}`;
}

function addCard(p){
  const card = document.createElement('div');
  card.className = 'card st-' + p.sk;
  card.innerHTML = cardHtml(p);
  const row = botRow(card, true);
  card.querySelectorAll('.clamp').forEach(el => { if(el.scrollHeight > el.clientHeight + 3) el.classList.add('has-more'); });
  card.querySelectorAll('.more').forEach(btn => btn.addEventListener('click', () => {
    const open = btn.previousElementSibling.classList.toggle('open');
    btn.textContent = open ? 'Show less ▴' : 'Show more ▾';
    btn.setAttribute('aria-expanded', open);
  }));
  card.querySelectorAll('.olderbtn').forEach(btn => btn.addEventListener('click', () => {
    const box = btn.previousElementSibling, open = box.hidden;       // hidden -> opening
    box.hidden = !open;
    btn.textContent = open ? 'Hide earlier updates ▴' : `Show ${btn.dataset.n} earlier update${btn.dataset.n>1?'s':''} ▾`;
    btn.setAttribute('aria-expanded', open);
  }));
  scrollToTop(row);
}

/* ---------- portfolio dashboard ---------- */
const nf = v => v.toLocaleString('en-US', {maximumFractionDigits:1});
const PF_BARS = [
  ['ahead',   'Ahead of Schedule', 'متقدم',         'ahead of schedule'],
  ['ontrack', 'On Schedule',       'منتظم',         'on schedule'],
  ['delay',   'Delayed',           'متأخر',         'delayed'],
  ['trouble', 'Troubled',          'متعثر',         'troubled'],
  ['susp',    'Fully Suspended',   'ايقاف كلي',     'fully suspended'],
  ['completed','Completed',        'مكتمل التنفيذ', 'completed'],
];
function portfolioHtml(){
  const P = PORTFOLIO, max = Math.max(1, ...PF_BARS.map(b => P.status[b[0]] || 0));
  const bars = PF_BARS.map(([k,en,ar,q]) => {
    const n = P.status[k] || 0, w = n ? Math.max(4, Math.round(n/max*100)) : 0;
    return `<button class="brow c-${k}" data-q="${q}" ${n ? '' : 'disabled'} aria-label="${en}: ${n} projects">` +
           `<div class="btop"><span class="bl"><b>${en}</b><small>${ar}</small></span><span class="bn"><b>${n}</b></span></div>` +
           `<div class="btrack"><i style="width:${w}%"></i></div></button>`;
  }).join('');
  const vc = P.variance < 0 ? 'neg' : P.variance > 0 ? 'pos' : 'mute';
  const kpis = [
    tile({v:`${nf(P.budgetM)}<span class="u">M SAR</span>`, big:true, l:LBL.pfBudget}),
    tile({v:fmtPct(P.planned), big:true, l:LBL.pfPlanned, bar:P.planned, bc:'#7FA7D9'}),
    tile({v:fmtPct(P.actual),  big:true, l:LBL.pfActual,  bar:P.actual,  bc:'#2ED39B'}),
    tile({v:fmtSigned(P.variance), big:true, cls:vc, l:LBL.pfVariance}),
  ].join('');
  const inv = [
    tile({v:nf(P.approvedCount), big:true, cls:'v-blue', l:LBL.invApprNo}),
    tile({v:`${nf(P.approvedM)}<span class="u">M SAR</span>`, big:true, cls:'v-blue', l:LBL.invApprAmt}),
    tile({v:nf(P.paidCount), big:true, cls:'good', l:LBL.invPaidNo}),
    tile({v:`${nf(P.paidM)}<span class="u">M SAR</span>`, big:true, cls:'good', l:LBL.invPaidAmt}),
  ].join('');
  return `<div class="strip"></div>
    <div class="pfhead"><div class="t"><b>${LBL.pfStatus[0]}</b><small>${LBL.pfStatus[1]}</small></div>
      <div class="d">Weekly control · data through ${REPORT_DATE}</div></div>
    <div class="totalbox"><span class="tn">${P.total}</span><span class="tt"><b>${LBL.pfTotal[0]}</b><small>${LBL.pfTotal[1]}</small></span></div>
    ${bars}
    <div class="bhint">Tap a bar to list those projects.</div>
    <div class="pfsec"><div class="sh"><b>${LBL.pfDash[0]}</b><small>${LBL.pfDash[1]}</small></div><div class="grid g2">${kpis}</div></div>
    <div class="pfsec"><div class="sh"><b>${LBL.pfInv[0]}</b><small>${LBL.pfInv[1]}</small></div><div class="grid g2">${inv}</div></div>`;
}
function addPortfolio(scroll){
  const card = document.createElement('div');
  card.className = 'card pf';
  card.innerHTML = portfolioHtml();
  const row = botRow(card, true);
  card.querySelectorAll('.brow:not(:disabled)').forEach(b => b.addEventListener('click', () => handleQuery(b.dataset.q, cap(b.dataset.q))));
  if(scroll) scrollToTop(row);
}
function portfolioSpeech(){
  const P = PORTFOLIO, s = P.status;
  return `Portfolio of ${P.total} projects. ${s.ahead} ahead of schedule, ${s.ontrack} on schedule, ${s.delay} delayed, ${s.trouble} troubled, ${s.susp} fully suspended. ` +
         `Budget ${nf(P.budgetM)} million riyals with taxes. Planned ${P.planned} percent, performance ${P.actual} percent, variance ${P.variance} percent. ` +
         `${P.approvedCount} approved invoices worth ${nf(P.approvedM)} million, and ${P.paidCount} paid invoices worth ${nf(P.paidM)} million.`;
}

/* =====================================================================
   Conversation
   ===================================================================== */
const HELP_INTRO = "Hi, I'm your PMO Bot, I'm here to help you get the latest weekly updates on projects.";
const HELP_TEXT =
  HELP_INTRO + "\n\n" +
  "I show the weekly control card of any project (data through " + REPORT_DATE + "). Ask me by:\n" +
  "• *PO* — e.g. 901240386 (or its last digits)\n" +
  "• *Project / contractor / consultant* — Arabic or English, e.g. Yanbu, Badr, ينبع\n" +
  "• *Status* — troubled, delayed, fully suspended, on schedule, ahead\n" +
  "• *Flags* — zero progress, partially suspended, critical\n" +
  "• *Area* — Madinah, Tabuk\n" +
  "• *Portfolio* — status bars, budget, planned / performance / variance and invoices (tap 📊)\n\n" +
  "Combine them freely: “delayed in Madinah”, “zero progress Tabuk”.\n" +
  "🎤 Tap the mic to speak, 🔊 to hear replies read aloud.";

const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
function handleQuery(qRaw, label){
  qRaw = String(qRaw||'').trim();
  if(!qRaw) return;
  addText(label || qRaw, 'out');
  showTyping();
  setTimeout(() => {
    hideTyping();
    let r;
    try { r = search(qRaw); } catch(e){ console.error(e); r = {type:'none'}; }
    respond(r, qRaw);
  }, 450 + Math.random()*350);
}

function respond(r, qRaw){
  if(r.type==='help'){
    addText(HELP_TEXT, 'in');
    speakResponse(HELP_INTRO + " You can ask me by PO number, project or contractor name, status, or area. Try saying delayed projects in Madinah.");
    return;
  }
  if(r.type==='portfolio'){
    addText(`Here's the portfolio status and dashboard (data through ${REPORT_DATE}):`, 'in');
    addPortfolio(true);
    speakResponse(portfolioSpeech());
    return;
  }
  if(r.type==='raghint'){
    addText("Projects are classified by their official status rather than red / amber / green. Try *troubled*, *delayed*, *fully suspended*, *on schedule* or *ahead* — or *critical* for all delayed, troubled and suspended projects.", 'in');
    speakResponse("Projects are classified by official status. Try troubled, delayed, or critical.");
    return;
  }
  if(r.type==='none'){
    if(r.label){
      addText(`No projects match *${r.label}* in this report.${r.hasFilter ? '\nTip: try removing one filter.' : ''}`, 'in');
      speakResponse(`No projects match ${r.label}.`);
    } else {
      addText(`I couldn't find a project for “${qRaw}”. Try a PO (e.g. 901240386), part of a project or contractor name, a status (troubled, delayed, fully suspended, on schedule, ahead), an area (Madinah, Tabuk) or “zero progress”. Type *help* for examples.`, 'in');
      speakResponse("I couldn't find a match. Try a PO number, a name, a status, or an area.");
    }
    return;
  }
  if(r.type==='one'){
    const p = r.project;
    const lead = r.how==='po'    ? `Here's the latest control card for PO *${p.po}* (data through ${REPORT_DATE}):`
               : r.how==='fuzzy' ? `Closest match for “${qRaw}” — PO *${p.po}*:`
               :                   `Only one project matches *${r.label}* — PO *${p.po}*:`;
    addText(lead, 'in');
    addCard(p);
    speakResponse(cardToSpeech(p));
    return;
  }
  if(r.type==='list'){
    const n = r.list.length;
    const mixed = new Set(r.list.map(p => p.sk)).size > 1;
    const lead = `${r.fuzzy ? 'Closest matches — ' : ''}*${n}* project${n>1?'s':''} — ${r.label}${mixed ? '\n' + countsLine(r.list) : ''}\n\nTap one for its control card:`;
    speakResponse(`${n} projects. ${r.label}.`);
    addOptions(r.list, lead, n);
  }
}

/* =====================================================================
   Voice output (text-to-speech)
   ===================================================================== */
let voiceOutputEnabled = false;
const speakToggleBtn = $('speakToggleBtn');
function cleanForSpeech(t){ return t.replace(/\*/g,'').replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').replace(/\s+/g,' ').trim(); }
function speakResponse(text){
  if(!voiceOutputEnabled || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(cleanForSpeech(text));
  u.lang = 'en-US'; u.rate = 1.0;
  window.speechSynthesis.speak(u);
}
function fcSpeech(f){
  if(f.d) return fmtDate(f.d);
  if((f.t||'').indexOf('غير متوقع') >= 0) return 'not expected';
  if((f.t||'').indexOf('متعثر') >= 0) return 'already troubled';
  return 'already delayed';
}
function cardToSpeech(p){
  const v = p.variance<0 ? 'minus '+Math.abs(p.variance) : String(p.variance);
  let s = `PO ${p.po}. Status ${ST[p.sk].en}. Planned ${p.planned} percent, performance ${p.actual} percent, variance ${v} percent. Elapsed time ${p.elapsed} percent.`;
  if(p.zero>0) s += ` Zero progress for ${p.zero} months.`;
  if(p.susp>0) s += ` Suspension ${p.susp} percent.`;
  s += ` Expected delay ${fcSpeech(p.expDelay)}. Expected troubled ${fcSpeech(p.expTroubled)}.`;
  return s;
}
if(speakToggleBtn){
  speakToggleBtn.addEventListener('click', () => {
    voiceOutputEnabled = !voiceOutputEnabled;
    speakToggleBtn.textContent = voiceOutputEnabled ? '🔊' : '🔇';
    speakToggleBtn.classList.toggle('active', voiceOutputEnabled);
    speakToggleBtn.title = voiceOutputEnabled ? 'Spoken replies: on' : 'Spoken replies: off';
    if(!voiceOutputEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    if(voiceOutputEnabled) speakResponse('Spoken replies are now on.');
  });
}

/* =====================================================================
   Voice input (speech-to-text)
   ===================================================================== */
const micBtn = $('micBtn'), langBtn = $('langBtn'), voiceHint = $('voiceHint');
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recogLang = 'en-US', recognition = null, isListening = false;
if(SpeechRecognitionAPI){
  recognition = new SpeechRecognitionAPI();
  recognition.continuous = false; recognition.interimResults = false; recognition.maxAlternatives = 1;
  recognition.onstart  = () => { isListening = true; micBtn.classList.add('listening','active'); voiceHint.textContent = recogLang==='ar-SA' ? 'Listening (Arabic)… tap to stop' : 'Listening… tap to stop'; };
  recognition.onend    = () => { isListening = false; micBtn.classList.remove('listening','active'); voiceHint.textContent = 'Tap to speak'; };
  recognition.onerror  = e  => { isListening = false; micBtn.classList.remove('listening','active'); voiceHint.textContent = e.error==='not-allowed' ? 'Microphone blocked — allow it in settings' : 'Tap to speak'; };
  recognition.onresult = e  => { handleQuery(e.results[0][0].transcript); };
  micBtn.addEventListener('click', () => {
    if(isListening){ recognition.stop(); return; }
    recognition.lang = recogLang;
    try { recognition.start(); } catch(err){}
  });
  langBtn.addEventListener('click', () => {
    recogLang = recogLang==='en-US' ? 'ar-SA' : 'en-US';
    langBtn.textContent = recogLang==='en-US' ? 'EN' : 'AR';
    langBtn.title = 'Voice recognition language: ' + (recogLang==='en-US' ? 'English' : 'Arabic');
  });
} else {
  micBtn.classList.add('unsupported'); micBtn.disabled = true;
  micBtn.title = 'Voice input is not supported in this browser';
  langBtn.style.display = 'none';
  voiceHint.textContent = 'Voice not supported here';
}

/* =====================================================================
   Wiring + welcome
   ===================================================================== */
$('sendBtn').addEventListener('click', () => { const i=$('inp'); if(i.value.trim()){ handleQuery(i.value.trim()); i.value=''; } });
$('inp').addEventListener('keydown', e => { if(e.key==='Enter') $('sendBtn').click(); });
document.querySelectorAll('.quickchip').forEach(c => {
  const tabLabel = c => c.textContent.replace(/^[^\p{L}\p{N}]+/u, '').trim();
  c.addEventListener('click', () => handleQuery(c.dataset.q, tabLabel(c)));
  c.addEventListener('keydown', e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); handleQuery(c.dataset.q, tabLabel(c)); } });
});
$('headerAvatarSlot').innerHTML = avatarSvg();
addText("👋 Hi! I'm the NWC Northwestern Cluster PMO Bot.\n\nAsk for any project's weekly control card by *PO*, *name*, *contractor*, *status* or *area* (data through " + REPORT_DATE + ").\n\nTry: *901240386*, *troubled*, *delayed in Madinah*, *Yanbu* — or type *help*. Tap *📊 portfolio* any time for the dashboard.", 'in');
addPortfolio(false);
</script>
